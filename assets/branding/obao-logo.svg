<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">欧包音乐</title>
  <desc id="description">融合声波律动与圆润极简几何环形声场的独特现代音乐标志</desc>
  <defs>
    <!-- 背景流光渐变：深邃霓虹青蓝至瑰丽紫霞 -->
    <linearGradient id="bg-glow" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#181e36" />
      <stop offset="100%" stop-color="#2a1b3d" />
    </linearGradient>

    <!-- 动态主光环渐变：极光青 -> 珊瑚橙 -> 霓光洋红 -->
    <linearGradient id="ring-gradient" x1="120" y1="80" x2="390" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#4facfe" />
      <stop offset="75%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <!-- 声波脉冲渐变 -->
    <linearGradient id="wave-pulse" x1="160" y1="180" x2="350" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- 核心光晕滤镜 -->
    <filter id="neon-glow" x="40" y="40" width="432" height="432" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 柔和投影 -->
    <filter id="soft-shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 圆角外框 -->
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#bg-glow)" />
  <rect x="32" y="32" width="448" height="448" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" />

  <!-- 内部光感呼吸底球 -->
  <circle cx="256" cy="256" r="140" fill="url(#ring-gradient)" opacity="0.15" filter="url(#neon-glow)" />

  <!-- 核心声场共鸣符号：非主流同质化，采用律动环绕双极轨道与声波核心 -->
  <g filter="url(#soft-shadow)">
    <!-- 环形莫比乌斯声波外轨 -->
    <path
      d="M256 96 C344 96 416 168 416 256 C416 344 344 416 256 416 C168 416 96 344 96 256 C96 168 168 96 256 96 Z"
      fill="none"
      stroke="url(#ring-gradient)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-dasharray="380 90"
      transform="rotate(-25 256 256)"
    />

    <!-- 内部共振声波能量柱群 (形成抽象的 O / 音符律动感) -->
    <path d="M196 216 V296" stroke="url(#wave-pulse)" stroke-width="18" stroke-linecap="round" />
    <path d="M236 176 V336" stroke="url(#wave-pulse)" stroke-width="18" stroke-linecap="round" />
    <path d="M276 156 V356" stroke="url(#ring-gradient)" stroke-width="18" stroke-linecap="round" />
    <path d="M316 226 V286" stroke="url(#ring-gradient)" stroke-width="18" stroke-linecap="round" />

    <!-- 轨道交汇点高光粒子星芒 -->
    <circle cx="372" cy="180" r="10" fill="#ffffff" filter="url(#neon-glow)" />
    <circle cx="140" cy="332" r="7" fill="#ff0844" filter="url(#neon-glow)" />
  </g>
</svg>
