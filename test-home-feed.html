<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>测试发现音乐数据</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #0a0d12;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
    pre {
      background: #161d2b;
      padding: 15px;
      border-radius: 8px;
      overflow: auto;
      max-height: 600px;
    }
    .section {
      margin: 20px 0;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>发现音乐数据测试</h1>
  
  <div class="section">
    <h2>测试步骤</h2>
    <ol>
      <li>打开开发者工具控制台（F12）</li>
      <li>点击下面的按钮测试数据加载</li>
      <li>查看控制台输出和下方的结果</li>
    </ol>
  </div>

  <div class="section">
    <button onclick="testQQ()">测试 QQ 音乐推荐</button>
    <button onclick="testNetease()">测试网易云推荐</button>
    <button onclick="testQQLogin()">测试 QQ 登录状态</button>
    <button onclick="testNeteaseLogin()">测试网易云登录状态</button>
  </div>

  <div class="section">
    <h2>结果输出</h2>
    <div id="result"></div>
  </div>

  <script>
    const result = document.getElementById('result');

    function log(title, data) {
      console.log(`[${title}]`, data);
      const pre = document.createElement('pre');
      pre.innerHTML = `<strong>${title}:</strong>\n${JSON.stringify(data, null, 2)}`;
      result.appendChild(pre);
    }

    async function testQQ() {
      result.innerHTML = '<p>正在加载 QQ 音乐推荐...</p>';
      try {
        const data = await window.musicPlayer.music.getRecommendationHome('qq', { forceRefresh: true });
        log('QQ 音乐推荐数据', data);
        
        if (data.ok) {
          const feed = data.data;
          log('QQ 音乐详细数据', {
            providerId: feed.providerId,
            loggedIn: feed.loggedIn,
            dailySongsCount: feed.dailySongs?.length ?? 0,
            newSongsCount: feed.newSongs?.length ?? 0,
            dailySongs: feed.dailySongs?.slice(0, 3) ?? [],
            newSongs: feed.newSongs?.slice(0, 3) ?? [],
            moduleResults: feed.moduleResults
          });
        }
      } catch (error) {
        log('QQ 音乐错误', { error: error.message, stack: error.stack });
      }
    }

    async function testNetease() {
      result.innerHTML = '<p>正在加载网易云推荐...</p>';
      try {
        const data = await window.musicPlayer.music.getRecommendationHome('netease', { forceRefresh: true });
        log('网易云推荐数据', data);
        
        if (data.ok) {
          const feed = data.data;
          log('网易云详细数据', {
            providerId: feed.providerId,
            loggedIn: feed.loggedIn,
            dailySongsCount: feed.dailySongs?.length ?? 0,
            newSongsCount: feed.newSongs?.length ?? 0,
            dailySongs: feed.dailySongs?.slice(0, 3) ?? [],
            newSongs: feed.newSongs?.slice(0, 3) ?? [],
            moduleResults: feed.moduleResults
          });
        }
      } catch (error) {
        log('网易云错误', { error: error.message, stack: error.stack });
      }
    }

    async function testQQLogin() {
      result.innerHTML = '<p>正在检查 QQ 登录状态...</p>';
      try {
        const status = await window.musicPlayer.music.getLoginStatus('qq');
        log('QQ 登录状态', status);
      } catch (error) {
        log('QQ 登录状态错误', { error: error.message });
      }
    }

    async function testNeteaseLogin() {
      result.innerHTML = '<p>正在检查网易云登录状态...</p>';
      try {
        const status = await window.musicPlayer.music.getLoginStatus('netease');
        log('网易云登录状态', status);
      } catch (error) {
        log('网易云登录状态错误', { error: error.message });
      }
    }

    // 自动运行测试
    window.addEventListener('load', () => {
      console.log('=== 发现音乐数据诊断工具 ===');
      console.log('请点击按钮测试各个接口');
    });
  </script>
</body>
</html>
